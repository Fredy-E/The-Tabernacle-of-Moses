<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">The Tabernacle of Moses</title>
  <desc id="desc">A procedural 3D journey built from mathematics in a single HTML file. An isometric wire drawing of the courtyard and sanctuary illustrates the custom WebGL2 engine.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101924"/><stop offset="1" stop-color="#070c13"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ac8140" stop-opacity=".17"/><stop offset="1" stop-color="#ac8140" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9cb0c5" stroke-opacity=".055"/></pattern>
    <linearGradient id="gold" x2="1"><stop stop-color="#f1dcad"/><stop offset="1" stop-color="#b48c49"/></linearGradient>
  </defs>
  <rect width="1280" height="480" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="480" rx="18" fill="url(#grid)"/>
  <ellipse cx="1000" cy="235" rx="400" ry="330" fill="url(#glow)"/>
  <path d="M48 48H88" stroke="#d5b477" stroke-width="2"/>
  <text x="102" y="53" fill="#d5b477" font-family="Arial, sans-serif" font-size="12" letter-spacing="3">PROCEDURAL · IMMERSIVE · SELF-CONTAINED</text>
  <text x="48" y="148" fill="#f5efe4" font-family="Georgia, serif" font-size="64">The Tabernacle</text>
  <text x="48" y="220" fill="url(#gold)" font-family="Georgia, serif" font-size="64">of Moses</text>
  <text x="50" y="278" fill="#aebcc9" font-family="Arial, sans-serif" font-size="21">A 3D world built from formulas.</text>
  <text x="50" y="311" fill="#aebcc9" font-family="Arial, sans-serif" font-size="21">One HTML. A custom rendering engine.</text>
  <g font-family="Arial, sans-serif" font-size="12" letter-spacing="1.3" fill="#ecd5ac">
    <rect x="48" y="364" width="118" height="32" rx="16" fill="#d6b270" fill-opacity=".07" stroke="#b28d53" stroke-opacity=".45"/><text x="70" y="384">WEBGL2</text>
    <rect x="178" y="364" width="125" height="32" rx="16" fill="#d6b270" fill-opacity=".07" stroke="#b28d53" stroke-opacity=".45"/><text x="197" y="384">SINGLE HTML</text>
    <rect x="315" y="364" width="151" height="32" rx="16" fill="#d6b270" fill-opacity=".07" stroke="#b28d53" stroke-opacity=".45"/><text x="335" y="384">PARAMETRIC 3D</text>
